{% extends "base.html" %}
{% block title %}Acceso — Gestión de Equipos{% endblock %}

{% block extra_css %}
<style>
    body { display: flex; align-items: center; justify-content: center; }

    main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
    }

    .login-wrap {
        width: 100%;
        max-width: 420px;
        animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .login-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px; height: 56px;
        border: 2px solid var(--accent);
        border-radius: 12px;
        margin-bottom: 1.2rem;
        position: relative;
    }

    .login-logo::before {
        content: '';
        position: absolute;
        inset: -6px;
        border: 1px solid rgba(0,212,255,0.2);
        border-radius: 16px;
    }

    .login-logo svg { width: 28px; height: 28px; color: var(--accent); }

    .login-title {
        font-family: var(--mono);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .login-sub {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 6px;
        letter-spacing: 0.05em;
    }

    .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem;
        position: relative;
        overflow: hidden;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .form-group {
        margin-bottom: 1.2rem;
    }

    .form-label {
        display: block;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .form-input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 11px 14px;
        font-family: var(--mono);
        font-size: 0.88rem;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
    }

    .form-input::placeholder { color: var(--text-muted); }

    .btn-login {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 6px;
        font-family: var(--mono);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: all 0.2s;
    }

    .btn-login:hover {
        background: #00b8d9;
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(0,212,255,0.25);
    }

    .error-box {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.3);
        border-radius: 6px;
        padding: 10px 14px;
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--danger);
        margin-bottom: 1.2rem;
    }

    .login-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-header">
        <div class="login-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
            </svg>
        </div>
        <div class="login-title">Plataforma de Gestión</div>
        <div class="login-sub">acceso restringido // proyecto.local</div>
    </div>

    <div class="login-card">
        {% if error %}
        <div class="error-box">▸ {{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="username">usuario de dominio</label>
                <input class="form-input" type="text" id="username" name="username"
                       placeholder="profesor01" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">contraseña</label>
                <input class="form-input" type="password" id="password" name="password"
                       placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Iniciar sesión →</button>
        </form>
    </div>

    <div class="login-footer">
        autenticación vía active directory · proyecto.local
    </div>
</div>
